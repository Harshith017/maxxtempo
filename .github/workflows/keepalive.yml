# Supabase's free plan pauses a project after a week with no activity, and the app is
# down until someone restores it. This touches the database once a day so that never
# happens, even if nobody logs anything for a while. It uses only the public anon key
# (already in config.js), and row-level security means it can't read anyone's data.
name: Keep database awake
on:
  schedule:
    - cron: '17 3 * * *'   # every day, 08:47 in India
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database once
        run: |
          URL=$(grep -o "SUPABASE_URL: '[^']*'" config.js | cut -d"'" -f2)
          KEY=$(grep -o "SUPABASE_ANON_KEY: '[^']*'" config.js | cut -d"'" -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/leaderboard?select=week&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Database answered HTTP $code"
          test "$code" = 200
